name: Auto-update BTC dataset

# One job, one purpose: fetch live Bitcoin network telemetry and BTC-USD market
# data, validate it, and commit it *only if the numbers actually moved*. The
# commits this workflow produces are the dataset itself -- never a heartbeat,
# never an empty "keep the workflow alive" commit. If the fetch or the
# validation fails, the job fails and the last good dataset stays exactly as it
# was, which is the point: a red run is information, a silent no-op is not.

on:
  schedule:
    # 05:17 UTC daily. Deliberately after the UTC day boundary so yesterday's
    # daily candle is closed and can be appended as a finished bar.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# data/btc_market_daily.csv is an append-only file; two overlapping runs would
# race each other on the same rows and produce a conflicting commit.
concurrency:
  group: auto-update-btc-dataset
  cancel-in-progress: false

jobs:
  update-dataset:
    name: Fetch live BTC network + market data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Validates before writing: on a malformed payload this step exits
      # non-zero and no tracked file is modified. It also writes the commit
      # message, which names the real observed values.
      - name: Fetch and validate live data
        run: python scripts/fetch_data.py --summary-file "$RUNNER_TEMP/commit-message.txt"

      # Everything except the figures quoted in the docs must pass before we
      # publish. The figures are deliberately left out here: they are derived
      # from the files this run is about to commit (and from the baseline that
      # is regenerated after the data commit), so they are refreshed and then
      # verified at the end of the run instead of failing the fetch.
      - name: Check the dataset that was just written
        run: python scripts/check_repo.py --skip-readme-figures

      - name: Commit and push only if the dataset changed
        id: commit-data
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Dataset is already up to date for today -- nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Committing:"
          cat "$RUNNER_TEMP/commit-message.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git push

      # The baseline consumes the dataset, so it runs *after* the data commit above
      # has been pushed. If it fails, the fresh data still stands and this red step
      # is the visible signal -- a broken experiment must never hold back the data.
      # It commits results/ only when the regenerated numbers actually changed: that
      # is a real artifact, never a heartbeat commit.
      - name: Regenerate the baseline on the new data
        if: steps.commit-data.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python scripts/run_baseline.py
          if [ -z "$(git status --porcelain -- results/)" ]; then
            echo "Baseline results already match the new dataset -- nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "data(baseline): refresh results for the new candles" \
                     -m "Regenerated by scripts/run_baseline.py from the committed dataset; metrics are net of costs."
          git push

      # The prose quotes hard numbers (candle count, window dates, latest close,
      # baseline metrics) that this run just changed, so they are rewritten from
      # the files rather than by hand -- and then verified, so the README cannot
      # drift away from the data again. A commit happens only when a figure moved.
      - name: Refresh the figures quoted in the docs
        if: steps.commit-data.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python scripts/check_readme_numbers.py --fix
          if [ -z "$(git status --porcelain -- README.md data/README.md)" ]; then
            echo "The quoted figures already match the new dataset -- nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/README.md
          git commit -m "docs(readme): refresh the quoted figures from the new dataset" \
                     -m "Rewritten by scripts/check_readme_numbers.py --fix, which reads every quoted figure from data/ and results/ instead of trusting the prose."
          git push

      # Final gate: every claim in the repository, prose figures included, must
      # now agree with the committed files. This is the same check CI runs.
      - name: Check the repository and the quoted figures
        run: python scripts/check_repo.py
